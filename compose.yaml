services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: caseflow
      POSTGRES_USER: caseflow
      POSTGRES_PASSWORD: caseflow
    ports:
      - "55432:5432"
    volumes:
      - caseflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseflow -d caseflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caseflow_pgdata:
